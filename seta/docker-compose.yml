# Two services: the model (internal) and the app (the only one the browser
# talks to). The model is served through llama.cpp so the stack runs on any
# Docker host, GPU or not — Docker on Apple Silicon has no NVIDIA runtime.
# On an NVIDIA GPU box, swap in the vLLM service at the bottom for
# full-precision serving. The app only knows UPSTREAM_URL, so nothing else
# changes either way.

services:
  hy-mt:
    image: ghcr.io/ggml-org/llama.cpp:server
    command: >
      --host 0.0.0.0
      --port 8000
      -hf tencent/HY-MT1.5-1.8B-GGUF:Q4_K_M
      --alias hy-mt-1.8b
      --ctx-size 8192
      --temp 0.7 --top-p 0.6 --top-k 20 --repeat-penalty 1.05
    # Internal only: the app is the single public door. Uncomment to poke the
    # model directly while debugging.
    expose:
      - "8000"
    # ports:
    #   - "8000:8000"
    volumes:
      - hy-mt-cache:/root/.cache # keep the model download across restarts
    restart: unless-stopped
    # llama-server answers /health with 503 while the weights load and 200 once
    # the slots are ready (the image ships curl for exactly this).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s # first boot downloads the ~1.1 GB GGUF
    # Watch the download: docker compose logs -f hy-mt

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    # Wait for a loaded model, not just a started container: otherwise `up`
    # returns with a stack that 503s for the length of the download.
    depends_on:
      hy-mt:
        condition: service_healthy
    environment:
      - UPSTREAM_URL=http://hy-mt:8000/v1/chat/completions
      - STREAM_IDLE_TIMEOUT=30s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3

# --- GPU variant (vLLM, full precision) ------------------------------------
