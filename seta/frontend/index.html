<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0C10" />
  <meta name="description" content="seta — a local Chinese translator and HSK study notebook." />
  <title>seta</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%E4%B8%9D%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/style.css" />
  <script type="module" src="/src/main.ts"></script>
</head>
<body x-data="setaApp()">

  <!-- Icon sprite: one definition, used everywhere with <use href="#i-…">. -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M15 5.5A1.5 1.5 0 0 0 13.5 4H5.5A1.5 1.5 0 0 0 4 5.5v8A1.5 1.5 0 0 0 5.5 15"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></symbol>
    <symbol id="i-speak" viewBox="0 0 24 24"><path d="M11 5.5 6.5 9H3.5v6h3L11 18.5z"/><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M6.5 4h11v16l-5.5-3.8L6.5 20z"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M14.5 6.5 17.5 9.5"/></symbol>
    <symbol id="i-delete" viewBox="0 0 24 24"><path d="M4.5 7h15"/><path d="M9.5 7V4.8h5V7"/><path d="M6.8 7l1 12.2h8.4L17.2 7"/><path d="M10.5 10.5v5M13.5 10.5v5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v10.5"/><path d="M8 11l4 4 4-4"/><path d="M4.5 19.5h15"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-clear" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.6"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/><path d="M12 18v3"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3.5 3.5l17 17"/><path d="M9.9 6.2A9.7 9.7 0 0 1 12 6c6 0 9.5 6 9.5 6a17 17 0 0 1-3.2 3.9"/><path d="M6.2 8.1A17 17 0 0 0 2.5 12S6 18 12 18a9.9 9.9 0 0 0 3.5-.6"/></symbol>
  </svg>

  <div class="app">

    <header class="topbar">
      <h1 class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3 15c3-7 6-7 9 0s6 7 9 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span>seta</span>
      </h1>
      <div class="topbar-right">
        <span class="run-ind" x-show="isTranslating" x-cloak>
          <span class="run-dot" aria-hidden="true"></span>
          translating
        </span>
        <button
          class="act act-icon"
          type="button"
          @click="togglePinyin()"
          :aria-pressed="showPinyin"
          :title="showPinyin ? 'Hide pinyin' : 'Show pinyin'"
          :aria-label="showPinyin ? 'Hide pinyin' : 'Show pinyin'"
        >
          <svg class="act-ico" aria-hidden="true"><use :href="showPinyin ? '#i-eye' : '#i-eye-off'"/></svg>
        </button>
        <button
          class="icon-btn"
          type="button"
          @click="toggleTheme()"
          :aria-label="theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
          :title="theme === 'dark' ? 'Light mode' : 'Dark mode'"
        >
          <svg x-show="theme === 'dark'" class="ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <svg x-show="theme === 'light'" x-cloak class="ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </header>

    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" type="button" role="tab" :aria-selected="tab === 'translate'"
              @click="setTab('translate')">Translate</button>
      <button class="tab" type="button" role="tab" :aria-selected="tab === 'library'"
              @click="setTab('library')">
        Library<span class="tab-count" x-show="itemCount" x-text="itemCount"></span>
      </button>
      <button class="tab" type="button" role="tab" :aria-selected="tab === 'hsk'"
              @click="setTab('hsk')">HSK</button>
    </nav>

    <!-- ================= Translate ================= -->
    <main class="pane-wrap" x-show="tab === 'translate'" role="tabpanel" aria-label="Translate">
      <div class="panes">
        <section class="pane" aria-label="Source text">
          <div class="pane-head">
            <label class="pane-label" for="source">Type or paste</label>
            <div class="pane-actions">
              <span
                id="source-count"
                class="count"
                :class="{ 'count-over': overLimit }"
                x-text="sourceBytes + '/' + maxBytes"
                title="UTF-8 bytes — ⌘↵ translates now, Esc clears"
              ></span>
              <button class="act act-icon" type="button" x-show="sourceText" x-cloak
                      @click="clear()" title="Clear" aria-label="Clear the source text">
                <svg class="act-ico" aria-hidden="true"><use href="#i-clear"/></svg>
              </button>
            </div>
          </div>
          <textarea
            id="source"
            class="source"
            x-model="sourceText"
            @input.debounce.350ms="translate()"
            @keydown.escape="clear()"
            @keydown.meta.enter.prevent="translate()"
            @keydown.ctrl.enter.prevent="translate()"
            aria-describedby="source-count"
            :aria-invalid="overLimit"
            placeholder="English to translate, or Chinese to look up…"
            spellcheck="false"
          ></textarea>
          <p class="reading" lang="zh-Latn-pinyin"
             x-show="showPinyin && pinyinOf(sourceText)"
             x-text="pinyinOf(sourceText)"></p>
        </section>

        <section class="pane" aria-label="Translation">
          <div class="pane-head">
            <span class="pane-label" x-text="outputIsChinese ? '简体中文' : 'English'"></span>
            <div class="pane-actions"></div>
          </div>
          <!-- aria-live stays off while streaming: announcing every fragment
               would drown a screen reader. Completion is announced once. -->
          <div class="output" aria-live="off">
            <span class="output-text" :lang="outputIsChinese ? 'zh-Hans' : 'en'" x-show="translatedText" x-text="translatedText"></span>
            <span class="output-empty" x-show="!translatedText && isTranslating" x-cloak>…</span>
            <span class="output-empty" x-show="!translatedText && !isTranslating" x-text="placeholder"></span>
            <div
              class="pinyin"
              lang="zh-Latn-pinyin"
              x-show="outputIsChinese && showPinyin && pinyinText && translatedText"
              x-cloak
              x-text="pinyinText"
            ></div>

            <!-- The actions sit immediately under the translation, not pinned
                 to the bottom of a tall card. -->
            <div class="card-foot" x-show="canSaveTranslation" x-cloak>
              <button class="act" type="button" @click="copyTranslation()"
                      :title="copied ? 'Copied' : 'Copy the translation'"
                      :aria-label="copied ? 'Copied' : 'Copy the translation'">
                <svg class="act-ico" aria-hidden="true"><use :href="copied ? '#i-check' : '#i-copy'"/></svg>
                <span class="act-label" x-text="copied ? 'copied' : 'copy'"></span>
              </button>
              <button class="act" type="button" x-show="ttsAvailable" @click="speak(spokenText)"
                      title="Read it aloud" aria-label="Read it aloud">
                <svg class="act-ico" aria-hidden="true"><use href="#i-speak"/></svg>
                <span class="act-label">speak</span>
              </button>
              <button class="act act-primary" type="button" @click="openSaveFromTranslation()"
                      title="Save to the library" aria-label="Save to the library">
                <svg class="act-ico" aria-hidden="true"><use href="#i-save"/></svg>
                <span class="act-label">save</span>
              </button>
            </div>
          </div>
        </section>
      </div>
      <p class="error" role="alert" x-show="error" x-cloak x-text="error"></p>
    </main>

    <!-- ================= Library ================= -->
    <main class="pane-wrap" x-show="tab === 'library'" role="tabpanel" aria-label="Library">
      <div class="toolbar">
        <input class="search" type="search" x-model="libraryQuery"
               placeholder="Search Chinese, meaning, note, tags…" aria-label="Search the library" />
        <button class="act" type="button" @click="exportLibrary()" title="Download the library as JSON">
          <svg class="act-ico" aria-hidden="true"><use href="#i-download"/></svg>
          <span class="act-label">export</span>
        </button>
        <button class="act act-primary" type="button" @click="openSaveSheet()" title="Add an item by hand">
          <svg class="act-ico" aria-hidden="true"><use href="#i-plus"/></svg>
          <span class="act-label">add</span>
        </button>
      </div>

      <p class="hint" x-show="loadingItems" x-cloak>loading…</p>
      <p class="error" role="alert" x-show="libraryError" x-cloak x-text="libraryError"></p>

      <ul class="items" x-show="!loadingItems">
        <template x-for="item in visibleItems" :key="item.id">
          <li class="item">
            <div class="item-head">
              <button class="item-row" type="button" @click="toggleItem(item.id)"
                      :aria-expanded="expandedId === item.id">
                <span class="item-chinese" lang="zh-Hans" x-text="item.chinese"></span>
                <span class="item-pinyin" lang="zh-Latn-pinyin" x-show="pinyinOf(item.chinese)"
                      x-text="pinyinOf(item.chinese)"></span>
                <span class="item-meaning" x-show="item.meaning" x-text="item.meaning"></span>
                <span class="item-where" x-show="item.where" x-text="item.where"></span>
                <span class="tags" x-show="item.tags && item.tags.length">
                  <template x-for="tag in item.tags ?? []" :key="tag">
                    <span class="tag" x-text="tag"></span>
                  </template>
                </span>
              </button>
              <div class="item-quick">
                <button class="act act-icon" type="button" @click="copyText(item.chinese)"
                        title="Copy" :aria-label="'Copy ' + item.chinese">
                  <svg class="act-ico" aria-hidden="true"><use href="#i-copy"/></svg>
                </button>
                <button class="act act-icon" type="button" x-show="ttsAvailable" @click="speak(item.chinese)"
                        title="Speak" :aria-label="'Speak ' + item.chinese">
                  <svg class="act-ico" aria-hidden="true"><use href="#i-speak"/></svg>
                </button>
              </div>
            </div>

            <div class="item-body" x-show="expandedId === item.id" x-cloak>
              <p class="item-note" x-show="item.note" x-text="item.note"></p>
              <div class="actions">
                <button class="act" type="button" @click="openEditItem(item)">
                  <svg class="act-ico" aria-hidden="true"><use href="#i-edit"/></svg>
                  <span class="act-label">edit</span>
                </button>
                <button class="act act-danger" type="button" @click="removeItem(item)">
                  <svg class="act-ico" aria-hidden="true"><use href="#i-delete"/></svg>
                  <span class="act-label">delete</span>
                </button>
                <!-- Practice only appears when the assessment model and a
                     microphone are both available. -->
                <button class="act" type="button" x-show="practiceAvailable"
                        @click="togglePractice(item)"
                        :aria-pressed="practice[item.id]?.recording ?? false"
                        :title="practice[item.id]?.recording ?? false ? 'Stop and check' : 'Say it and check my tones'">
                  <svg class="act-ico" aria-hidden="true"><use :href="practice[item.id]?.recording ?? false ? '#i-stop' : '#i-mic'"/></svg>
                  <span class="act-label" x-text="practice[item.id]?.recording ?? false ? 'stop' : 'practice'"></span>
                </button>
              </div>

              <p class="recording" x-show="practice[item.id]?.recording ?? false" x-cloak>
                <span class="rec-dot" aria-hidden="true"></span>
                recording — say it now, then press stop (it ends by itself after 12s)
              </p>
              <p class="hint" x-show="practice[item.id]?.busy ?? false" x-cloak>checking your tones…</p>
              <p class="error" role="alert" x-show="practice[item.id]?.error" x-cloak
                 x-text="practice[item.id]?.error ?? ''"></p>

              <div class="verdicts" x-show="practice[item.id]?.assessment" x-cloak>
                <p class="verdict-summary">
                  <strong x-text="(practice[item.id]?.assessment?.score ?? 0) + '/100'"></strong>
                  <span x-show="practice[item.id]?.assessment?.unclear"
                        x-text="'· ' + (practice[item.id]?.assessment?.unclear ?? 0) + ' not clear'"></span>
                  <span class="verdict-heard"
                        x-text="'heard: ' + (practice[item.id]?.assessment?.heardText || '—')"></span>
                </p>
                <ul class="verdict-list">
                  <template x-for="syllable in practice[item.id]?.assessment?.syllables ?? []" :key="syllable.index">
                    <li class="verdict" :class="'verdict-' + syllable.verdict"
                        :title="verdictLabel(syllable.verdict)">
                      <span class="verdict-char" lang="zh-Hans" x-text="syllable.text"></span>
                      <span class="verdict-pinyin" lang="zh-Latn-pinyin" x-text="syllable.heard ?? '—'"></span>
                      <span class="verdict-expected" x-text="syllable.expected"></span>
                    </li>
                  </template>
                </ul>
                <p class="hint">green = heard right · amber = wrong tone · red = different syllable · grey = too quiet to judge</p>
              </div>
            </div>
          </li>
        </template>
      </ul>

      <p class="hint" x-show="!loadingItems && !visibleItems.length" x-cloak>
        <span x-show="itemCount === 0">Nothing saved yet. Translate something and press save, or add one by hand.</span>
        <span x-show="itemCount > 0">Nothing matches that search.</span>
      </p>
    </main>

    <!-- ================= HSK ================= -->
    <main class="pane-wrap" x-show="tab === 'hsk'" role="tabpanel" aria-label="HSK coverage">
      <h2 class="section-title">What you have met</h2>
      <div class="coverage">
        <template x-for="row in visibleLevels" :key="row.level">
          <div class="level">
            <span class="level-name" x-text="'HSK ' + row.level"></span>
            <span class="bar" role="img" :aria-label="row.seen + ' of ' + row.total + ' words seen'">
              <span class="bar-fill" :style="'width:' + percent(row) + '%'"></span>
            </span>
            <span class="level-count" x-text="row.seen + ' / ' + row.total"></span>
          </div>
        </template>
      </div>
      <button class="act act-quiet" type="button" x-show="hiddenLevelCount && !showAllLevels"
              @click="showAllLevels = true"
              x-text="'show HSK 4–7 (' + hiddenLevelCount + ')'"></button>
      <button class="act act-quiet" type="button" x-show="showAllLevels && hiddenLevelCount"
              @click="showAllLevels = false">hide HSK 4–7</button>

      <h2 class="section-title" x-show="coverage.current">
        Missing from HSK <span x-text="coverage.current"></span>
        <span class="section-meta" x-text="coverage.gap_total + ' words'"></span>
      </h2>
      <p class="error" role="alert" x-show="hskError" x-cloak x-text="hskError"></p>

      <ul class="gaps">
        <template x-for="word in coverage.gaps" :key="word.s">
          <li class="gap">
            <span class="gap-chinese" lang="zh-Hans" x-text="word.s"></span>
            <span class="gap-pinyin" lang="zh-Latn-pinyin" x-text="word.py"></span>
            <span class="gap-gloss" x-text="word.m"></span>
            <span class="actions">
              <button class="act act-icon" type="button" @click="copyText(word.s)"
                      title="Copy" :aria-label="'Copy ' + word.s">
                <svg class="act-ico" aria-hidden="true"><use href="#i-copy"/></svg>
              </button>
              <button class="act act-icon" type="button" x-show="ttsAvailable" @click="speak(word.s)"
                      title="Speak" :aria-label="'Speak ' + word.s">
                <svg class="act-ico" aria-hidden="true"><use href="#i-speak"/></svg>
              </button>
              <button class="act act-icon" type="button" @click="openSaveFromWord(word)"
                      title="Save to the library" :aria-label="'Save ' + word.s + ' to the library'">
                <svg class="act-ico" aria-hidden="true"><use href="#i-save"/></svg>
              </button>
            </span>
          </li>
        </template>
      </ul>

      <button class="act act-quiet" type="button" x-show="coverage.more" @click="loadMoreGaps()"
              x-text="loadingCoverage ? 'loading…' : 'load more'"></button>
      <p class="hint" x-show="!loadingCoverage && coverage.current && !coverage.gaps.length" x-cloak>
        Nothing missing at this level. Good place to be.
      </p>
    </main>

    <!-- ================= Save sheet (shared) ================= -->
    <div class="backdrop" x-show="sheet.open" x-cloak @click.self="closeSheet()" @keydown.escape.window="closeSheet()">
      <form class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" @submit.prevent="saveSheet()">
        <h2 class="sheet-title" id="sheet-title" x-text="sheet.id ? 'Edit item' : 'Save to library'"></h2>

        <label class="field">
          <span class="field-label">Chinese <span class="required" aria-hidden="true">*</span></span>
          <textarea class="field-input field-chinese" rows="2" x-model="sheet.chinese" lang="zh-Hans"
                    placeholder="汉字" autocomplete="off"></textarea>
          <span class="reading" lang="zh-Latn-pinyin" x-show="pinyinOf(sheet.chinese)"
                x-text="pinyinOf(sheet.chinese)"></span>
        </label>

        <label class="field">
          <span class="field-label">Meaning</span>
          <textarea class="field-input" rows="2" x-model="sheet.meaning" placeholder="your words, or the translation you kept"></textarea>
        </label>

        <label class="field">
          <span class="field-label">Where I found it</span>
          <input class="field-input" type="text" x-model="sheet.where" placeholder="a sign at the mall, my tutor, HSK 1…" />
        </label>

        <label class="field">
          <span class="field-label">Note</span>
          <textarea class="field-input" rows="2" x-model="sheet.note" placeholder="anything worth remembering"></textarea>
        </label>

        <div class="field">
          <span class="field-label">Tags</span>
          <div class="chips">
            <template x-for="tag in sheet.tags" :key="tag">
              <button type="button" class="tag tag-removable" @click="removeTag(tag)"
                      :aria-label="'Remove tag ' + tag">
                <span x-text="tag"></span><span class="tag-x" aria-hidden="true">×</span>
              </button>
            </template>
            <input class="chip-input" type="text" x-model="tagDraft" aria-label="Add a tag"
                   placeholder="add a tag…"
                   @keydown.enter.prevent="addTag()"
                   @keydown.backspace="tagsBackspace()"
                   @input="tagsChanged()" />
          </div>
        </div>

        <p class="error" role="alert" x-show="sheet.error" x-cloak x-text="sheet.error"></p>

        <div class="sheet-actions">
          <button class="act" type="button" @click="closeSheet()">cancel</button>
          <button class="act act-primary" type="submit" :disabled="sheet.saving || !sheet.chinese.trim()"
                  x-text="sheet.saving ? 'saving…' : 'save'"></button>
        </div>
      </form>
    </div>

    <div class="toast" x-show="toast" x-cloak role="status" x-text="toast"></div>
    <p class="sr-only" aria-live="polite" x-text="announcement"></p>

  </div>

</body>
</html>
