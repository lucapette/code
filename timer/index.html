<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0C10" />
  <meta name="description" content="Timer — an interval timer with a clear session plan, current-interval countdown, and voice and audio alerts." />
  <title>Interval Timer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%E2%8F%B1%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/style.css" />
  <script type="module" src="/src/main.ts"></script>
</head>
<body x-data="timerApp()" :class="{ 'session-mode': sessionMode }">

  <div class="app">

    <header class="topbar">
      <div class="topbar-left">
        <button
          class="icon-btn"
          type="button"
          x-show="view === 'edit'"
          x-cloak
          @click="view = 'timer'"
          aria-label="Back to timer"
        >
          <svg class="ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <h1 class="brand" x-show="view === 'timer'">
          <svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="13" r="8" stroke="currentColor" stroke-width="2"/>
            <path d="M12 9v4l2.5 2.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M12 5V3M9 2h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span x-text="session.name">7 min</span>
        </h1>
        <h2 class="topbar-title" x-show="view === 'edit'" x-cloak>Presets</h2>
      </div>
      <div class="topbar-right">
        <span class="run-ind" x-show="view === 'edit' && status !== 'IDLE'" x-cloak>
          <span class="run-dot" :class="{ paused: status === 'PAUSED' }" aria-hidden="true"></span>
          <span x-text="sessionDisplay"></span>
        </span>
        <button
          class="icon-btn edit-btn"
          type="button"
          x-show="view === 'timer'"
          @click="openEdit()"
          :disabled="status === 'RUNNING'"
          aria-label="Open preset editor"
          title="Presets"
        >
          <svg class="ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button
          class="icon-btn"
          type="button"
          @click="toggleTheme()"
          :aria-label="theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
          :title="theme === 'dark' ? 'Light mode' : 'Dark mode'"
        >
          <svg x-show="theme === 'dark'" class="ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <svg x-show="theme === 'light'" x-cloak class="ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </header>

    <main>

      <section class="hero" aria-label="Countdown" x-show="view === 'timer'">
        <h2 class="session-name" x-show="sessionMode" x-cloak x-text="session.name">7 min</h2>
        <div class="session">
          <div class="stage">
            <div
              class="time"
              role="timer"
              :style="{ color: clockColor }"
              :class="{ 'time-long': intervalRemaining >= 3600 }"
              x-text="displayTime"
            >1:00</div>
            <div class="interval-label" x-text="intervalCaption">ready to start</div>
            <div class="next" x-show="nextLabel" x-text="nextLabel ? 'next: ' + nextLabel : ''">next: REST</div>
          </div>

          <div
            class="strip"
            role="img"
            :aria-label="'Plan: ' + patternStripCaption"
          >
            <template x-for="(seg, i) in patternStrip" :key="i">
              <div
                class="seg"
                :class="{ current: i === patternIndex, done: status !== 'IDLE' && i < patternIndex, future: i > patternIndex }"
                :style="segStyle(seg, i)"
                :title="(seg.label ? seg.label + ' ' : 'interval ' + (i + 1) + ' ') + '· ' + seg.seconds + 's'"
              ></div>
            </template>
          </div>

          <div class="session-line">
            <div class="session-meta">
              <span class="session-label">Session</span>
              <span class="session-right">
                <span class="session-left" x-text="sessionDisplay">7:00</span>
                <span class="session-unit">left</span>
                <span x-show="intervalProgress" class="session-dot" aria-hidden="true">·</span>
                <span class="session-count" x-show="intervalProgress" x-text="intervalProgress">1 / 7</span>
              </span>
            </div>
            <span class="session-track"><span class="session-fill" :style="{ width: sessionPercent + '%' }"></span></span>
          </div>
        </div>
      </section>

      <section class="controls" aria-label="Timer controls" x-show="view === 'timer'">
        <div class="controls-row">
          <button
            class="btn-primary"
            type="button"
            @click="togglePlay()"
            :aria-label="status === 'RUNNING' ? 'Pause timer' : status === 'PAUSED' ? 'Resume timer' : 'Start timer'"
          >
            <svg x-show="status === 'RUNNING'" x-cloak class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <rect x="6" y="4" width="4" height="16" rx="1.5"/>
              <rect x="14" y="4" width="4" height="16" rx="1.5"/>
            </svg>
            <svg x-show="status !== 'RUNNING'" class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86a1 1 0 0 0-1.5.86Z"/>
            </svg>
            <span class="btn-label" x-text="playLabel">Start</span>
          </button>
          <button
            class="btn-ghost"
            type="button"
            @click="reset()"
            :disabled="status === 'IDLE'"
          >Reset</button>
        </div>

        <div class="picks" role="group" aria-label="Presets" x-show="view === 'timer'">
          <template x-for="preset in presets" :key="preset.id">
            <button
              class="pick"
              type="button"
              @click="applyPreset(preset.id)"
              :disabled="status === 'RUNNING'"
              :class="{ active: activePresetId === preset.id }"
              :aria-pressed="activePresetId === preset.id"
            >
              <span class="pick-name" x-text="preset.name">7 min</span>
              <span class="pick-strip" aria-hidden="true">
                <template x-for="(seg, i) in miniStrip(preset)" :key="i">
                  <span class="mini-seg" :style="miniSegStyle(seg, i)"></span>
                </template>
              </span>
            </button>
          </template>
        </div>
      </section>

      <section class="editor" aria-label="Preset editor" x-show="view === 'edit'" x-cloak>

        <div class="editor-form">
          <div class="draft-preview" x-show="draftIntervals.length">
            <span class="field-label">Plan</span>
            <span class="pick-strip strip-lg" aria-hidden="true">
              <template x-for="(seg, i) in draftStrip" :key="i">
                <span class="mini-seg" :style="miniSegStyle(seg, i)"></span>
              </template>
            </span>
          </div>

          <div class="field">
            <label class="field-label" for="preset-name">Name</label>
            <input
              id="preset-name"
              class="input"
              type="text"
              x-model="draftName"
              placeholder="e.g. HIIT 25"
              maxlength="32"
            />
          </div>

          <div class="field">
            <span class="field-label">Intervals</span>
            <p class="field-hint">Intervals play in order as a chain. Add a few to build a routine, or one long one for a plain countdown.</p>
            <div class="interval-list">
              <template x-for="(iv, i) in draftIntervals" :key="i">
                <div class="interval-row">
                  <div class="interval-top">
                    <input
                      class="input interval-label"
                      type="text"
                      x-model="iv.label"
                      placeholder="Work / Rest"
                      maxlength="32"
                      :aria-label="'Interval ' + (i + 1) + ' label'"
                    />
                  </div>
                  <div class="interval-value-row">
                    <input
                      class="big-input"
                      type="number"
                      min="5"
                      step="1"
                      x-model.number="iv.seconds"
                      :aria-label="'Interval ' + (i + 1) + ' seconds'"
                    />
                    <span class="unit">seconds</span>
                    <div class="interval-stepper">
                      <button type="button" @click="draftIntervalAdjust(i, -60)" aria-label="Subtract one minute">−1m</button>
                      <button type="button" @click="draftIntervalAdjust(i, -10)" aria-label="Subtract ten seconds">−10s</button>
                      <button type="button" @click="draftIntervalAdjust(i, 10)" aria-label="Add ten seconds">+10s</button>
                      <button type="button" @click="draftIntervalAdjust(i, 60)" aria-label="Add one minute">+1m</button>
                    </div>
                    <button
                      class="icon-btn icon-btn-sm"
                      type="button"
                      @click="removeDraftInterval(i)"
                      :aria-label="'Remove interval ' + (i + 1)"
                    >
                      <svg class="ico-sm" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                      </svg>
                    </button>
                  </div>
                </div>
              </template>
              <button class="btn-add-interval" type="button" @click="addDraftInterval()">
                <svg class="ico-sm" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span>Add interval</span>
              </button>
            </div>
          </div>

          <div class="field">
            <span class="field-label">Total session</span>
            <div class="value-row">
              <input
                class="big-input"
                type="number"
                min="1"
                step="0.5"
                x-model.number="draftTotalMinutes"
                aria-label="Total minutes"
              />
              <span class="unit">minutes</span>
              <div class="stepper">
                <button type="button" @click="draftTotalAdjust(-5)" aria-label="Subtract five minutes">−5</button>
                <button type="button" @click="draftTotalAdjust(-1)" aria-label="Subtract one minute">−1</button>
                <button type="button" @click="draftTotalAdjust(1)" aria-label="Add one minute">+1</button>
                <button type="button" @click="draftTotalAdjust(5)" aria-label="Add five minutes">+5</button>
              </div>
            </div>
            <p
              class="field-hint"
              x-show="draftSum > draftTotalMinutes * 60"
              x-text="'Pattern is ' + draftSum + 's — session raised to ' + Math.ceil(draftSum / 60) + ' min.'"
            ></p>
          </div>

          <button class="btn-save" type="button" @click="savePreset()" x-text="draftPresetId === 'new' ? 'Save preset' : 'Update preset'">Save preset</button>
        </div>

        <div class="preset-list" x-show="savedPresets.length">
          <div class="preset-list-head">
            <h3>Your presets</h3>
            <button class="btn-ghost btn-ghost-sm" type="button" @click="newDraft()">New</button>
          </div>
          <template x-for="p in savedPresets" :key="p.id">
            <div class="saved-row">
              <button class="saved-apply" type="button" @click="applyPreset(p.id); view = 'timer'" :aria-label="'Run ' + p.name">
                <span class="saved-name" x-text="p.name"></span>
                <span class="saved-min" x-text="Math.round(p.totalSeconds / 60) + ' min · ' + p.intervals.length + ' intv'"></span>
                <span class="saved-strip" aria-hidden="true">
                  <template x-for="(seg, i) in miniStrip(p)" :key="i">
                    <span class="mini-seg" :style="miniSegStyle(seg, i)"></span>
                  </template>
                </span>
              </button>
              <button
                class="icon-btn icon-btn-sm"
                type="button"
                @click="openConfigFor(p.id)"
                :aria-label="'Edit preset ' + p.name"
                :title="'Edit ' + p.name"
              >
                <svg class="ico-sm" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
              <button
                class="icon-btn icon-btn-sm"
                type="button"
                @click="deletePreset(p.id)"
                :aria-label="'Delete preset ' + p.name"
              >
                <svg class="ico-sm" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
          </template>
        </div>

      </section>

    </main>

  </div>

</body>
</html>
